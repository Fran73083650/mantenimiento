<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitio en mantenimiento</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .container { max-width: 480px; }
    .icon { font-size: 56px; margin-bottom: 24px; }
    h1 { font-size: 28px; margin-bottom: 12px; font-weight: 600; }
    p { font-size: 16px; color: #94a3b8; line-height: 1.6; }
    .footer { margin-top: 32px; font-size: 13px; color: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🛠️</div>
    <h1>Sitio en mantenimiento</h1>
    <p>Estamos realizando mejoras. Volvemos pronto.</p>
    <div class="footer">Futurominero</div>
  </div>
</body>
</html>
